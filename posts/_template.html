<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} - SirBepy Blog</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="../assets/images/favicon.png" />
    <meta property="og:url" content="https://sirbepy.github.io/sirbepy_blog/posts/{{SLUG}}.html" />
    <meta property="og:type" content="article" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sirbepy/bepy-project-init@main/styleguide.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css" />
    <link rel="stylesheet" href="../src/styles/styles.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <main class="post-page">
      <nav class="post-nav-top">
        <a href="../index.html" class="back-link">
          <i class="ph ph-arrow-left"></i>
          <span>All posts</span>
        </a>
        <a href="./{{SLUG}}.md" class="download-link" title="Download as Markdown for Obsidian">
          <i class="ph ph-download-simple"></i>
          <span>.md</span>
        </a>
      </nav>

      <article class="post">
        <header class="post-header">
          <h1>{{TITLE}}</h1>
          <p class="post-subtitle">{{DESCRIPTION}}</p>
          <div class="post-meta">
            <span class="post-date"><i class="ph ph-calendar-blank"></i> {{DATE}}</span>
            <span class="post-reading-time"><i class="ph ph-clock"></i> {{READING_TIME}} min read</span>
          </div>
        </header>

        <div class="post-body">
{{BODY}}
        </div>

        <footer class="post-footer">
          <a href="../index.html" class="back-link">
            <i class="ph ph-arrow-left"></i>
            <span>Back to all posts</span>
          </a>
        </footer>
      </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sirbepy/bepy-project-init@main/widget/settings.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/sirbepy/bepy-project-init@main/widget/background.js"></script>
  </body>
</html>
